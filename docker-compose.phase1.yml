# Phase 1 local stack: http://localhost:${NSM_PORT:-8080} stands in for https://nayisamakhya.org.
#   docker compose -f docker-compose.phase1.yml up -d --build
#   ./scripts/exit-gate-1.sh
# Port taken? NSM_PORT=8088 docker compose ... && BASE=http://localhost:8088 ./scripts/exit-gate-1.sh
name: nsm-phase1

services:
  nsm-app:
    build: .
    environment:
      SSO_ISSUER: https://nayisamakhya.org
      SSO_AUDIENCE: nayisamakhya-matrimony
      SSO_JWKS_URL: http://mock-sso:4000/.well-known/jwks.json
      SSO_LOGIN_URL: http://localhost:${NSM_PORT:-8080}/login
      APP_ORIGIN: http://localhost:${NSM_PORT:-8080}
    expose: ["3000"]
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      mock-sso:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/matrimony/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock-sso:
    image: node:24-alpine
    command: ["node", "/srv/server.mjs"]
    environment:
      NODE_ENV: development
      PORT: "4000"
    volumes:
      - ./deploy/mock-sso:/srv:ro
    expose: ["4000"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/.well-known/jwks.json"]
      interval: 3s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${NSM_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx/matrimony.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/matrimony-locations.conf:/etc/nginx/nsm/matrimony-locations.conf:ro
    depends_on:
      nsm-app:
        condition: service_healthy
      mock-sso:
        condition: service_healthy
