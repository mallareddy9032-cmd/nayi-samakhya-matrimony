# ==============================================================================
# NAYI SAMAKHYA ROOT REVERSE PROXY CONFIGURATION
# To be added to the nayisamakhya.org NGINX configuration
# ==============================================================================

# 1. Place in 'http' context (e.g., /etc/nginx/nginx.conf or /etc/nginx/conf.d/):
# limit_req_zone $binary_remote_addr zone=nsm_limit:10m rate=10r/s;

# 2. Place inside the 'server { server_name nayisamakhya.org; ... }' block:

# Primary Matrimonial Sub-directory Routing
# Note: Using '^~' modifier prevents parent regexes (like static assets or PHP rules)
# from accidentally capturing /matrimony requests.
location ^~ /matrimony {
    limit_req zone=nsm_limit burst=20 nodelay;

    proxy_pass http://127.0.0.1:8088/matrimony;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Security: strip internal Next.js middleware subrequest header (CVE-2025-29927 mitigation)
    proxy_set_header X-Middleware-Subrequest "";

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}

# Immutable static asset caching for Next.js build chunks
location ^~ /matrimony/_next/static {
    proxy_pass http://127.0.0.1:8088/matrimony/_next/static;
    proxy_cache_valid 200 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
