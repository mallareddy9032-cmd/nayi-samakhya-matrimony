# http-context config for NSM.
# Production: copy everything above the "LOCAL STACK ONLY" marker into the parent portal's http {},
# then `include matrimony-locations.conf;` inside the nayisamakhya.org server {} block.

server_tokens off;

# Per-client-IP rate limits. If NGINX sits behind a CDN/LB, configure real_ip first so
# $binary_remote_addr is the client, not the balancer.
limit_req_zone $binary_remote_addr zone=nsm_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=nsm_discovery:10m rate=2r/s;

# $uri, not $request: query strings (search filters, return_to) never reach the access log.
log_format nsm '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent '
               '$request_time rid=$request_id';
# Photo requests: no path at all (photo URLs are personal data, even without the signature).
log_format nsm_media '$remote_addr [$time_local] "$request_method /matrimony/media" $status $body_bytes_sent '
                     '$request_time rid=$request_id';

upstream nsm_app {
    server nsm-app:3000;
    keepalive 16;
}

# ---------------------------------------------------------------- LOCAL STACK ONLY
# Stand-in for nayisamakhya.org: NSM under /matrimony, mock parent portal everywhere else.
server {
    listen 8080;
    server_name localhost;

    # matrimony-locations.conf, plus matrimony-media.conf when the Phase 4 overlay mounts it.
    include /etc/nginx/nsm/matrimony-*.conf;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://mock-sso:4000;
    }
}
