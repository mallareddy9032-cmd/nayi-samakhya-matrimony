# server-context: included verbatim into the parent nayisamakhya.org server {} (and the local stack).
# ^~ stops parent regex locations (e.g. static-asset caching rules) from capturing NSM paths.
location ^~ /matrimony {
    limit_req zone=nsm_general burst=20 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/access.log nsm;
    client_max_body_size 1m;

    # HSTS without includeSubDomains/preload: that is a whole-domain decision for the parent portal.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Script-agnostic fallback; the app adds the full nonce-based CSP. Browsers enforce both.
    add_header Content-Security-Policy "object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    # Internal Next.js header; a client-supplied value must never reach the app (CVE-2025-29927 class).
    proxy_set_header X-Middleware-Subrequest "";
    proxy_pass http://nsm_app;

    location ^~ /matrimony/api/discover {
        limit_req zone=nsm_discovery burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://nsm_app;
    }

    # Discovery grid: the anti-scraping limit applies to the page itself.
    location ^~ /matrimony/discover {
        limit_req zone=nsm_discovery burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://nsm_app;
    }

    # Photo uploads (5 MB file + multipart overhead); the app re-checks the size.
    location = /matrimony/api/photos {
        client_max_body_size 6m;
        proxy_pass http://nsm_app;
    }
}
