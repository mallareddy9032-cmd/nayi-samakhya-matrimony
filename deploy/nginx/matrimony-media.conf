# server-context: profile photos, included next to matrimony-locations.conf (Phase 4+).
# The app mints a short-lived SigV4 URL only after its own access check (session, consent, Sagothra,
# photo_visibility); the object store verifies signature and expiry. Host is passed through because
# the signature covers the public host. Production: point proxy_pass at the real private bucket.
location ^~ /matrimony/media/nsm-profile-photos/ {
    limit_except GET HEAD { deny all; }
    limit_req zone=nsm_general burst=20 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/access.log nsm_media;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    # Never forward the member's session (or a client-chosen S3 Authorization) to the object store.
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header X-Amz-Request-Id;
    proxy_hide_header X-Amz-Id-2;

    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=63072000" always;

    proxy_pass http://minio:9000/nsm-profile-photos/;
}
